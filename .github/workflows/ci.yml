name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # 1. Code hygiene: lint + format check
  hygiene:
    name: Code hygiene (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.8.0"

      - name: Ruff lint
        run: ruff check src main.py populate_index.py hf_embeddings.py

      - name: Ruff format check (advisory)
        continue-on-error: true
        run: ruff format --check src main.py populate_index.py hf_embeddings.py

  # 2. Validate dependencies install cleanly and code compiles
  dependencies:
    name: Dependencies & compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for dependency conflicts
        run: pip check

      - name: Compile all Python files
        run: python -m compileall -q src main.py populate_index.py hf_embeddings.py

      - name: Verify pinecone package (not deprecated shim)
        run: |
          python -c "import pinecone; print('pinecone version:', getattr(pinecone, '__version__', 'unknown'))"
          python -c "from pinecone import Pinecone, ServerlessSpec; print('Pinecone + ServerlessSpec import OK')"
          test -z "$(grep -E '^pinecone-client' requirements.txt || true)" || (echo "ERROR: requirements.txt still uses deprecated pinecone-client" && exit 1)
          grep -qE '^pinecone>=' requirements.txt || (echo "ERROR: requirements.txt must declare pinecone>=..." && exit 1)

  # 3. Health smoke tests (no network / no secrets required)
  smoke:
    name: Health smoke tests
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import Streamlit entrypoint modules
        run: |
          python -c "import src.retrieval.pinecone_client as m; print('pinecone_client import OK:', m.__name__)"
          python -c "from src.retrieval import PineconeClient, create_pinecone_client; print('retrieval package import OK')"
          python -c "from src.config import PineconeConfig, get_config; print('config import OK')"
          python -c "import main; print('main.py import OK')"

      - name: Verify Pinecone index binding is 'rag1'
        run: |
          python -c "from src.config import PineconeConfig; assert PineconeConfig().index_name == 'rag1', PineconeConfig().index_name; print('PineconeConfig default index: rag1 OK')"
          grep -q 'PINECONE_INDEX_NAME=rag1' .env.example || (echo "ERROR: .env.example not bound to rag1" && exit 1)
          grep -q 'PINECONE_INDEX_NAME = "rag1"' .streamlit/secrets.toml.example || (echo "ERROR: secrets.toml.example not bound to rag1" && exit 1)
          echo "Index binding (config + templates): rag1 OK"

      - name: Health check — create client object offline
        run: |
          python - <<'PY'
          from unittest.mock import MagicMock
          from src.retrieval import create_pinecone_client
          client = create_pinecone_client(
              api_key="dummy-key-for-smoke-test",
              index_name="rag1",
              embeddings=MagicMock(),
          )
          assert client.index_config.name == "rag1", client.index_config.name
          assert client.index_config.spec is not None, "ServerlessSpec should be auto-populated"
          print("PineconeClient offline construction OK (index=rag1)")
          PY

  # 4. Deployability gate for Streamlit Cloud
  deploy-readiness:
    name: Deploy readiness (Streamlit Cloud)
    runs-on: ubuntu-latest
    needs: [hygiene, smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Required files present
        run: |
          test -f main.py || (echo "ERROR: main.py missing" && exit 1)
          test -f requirements.txt || (echo "ERROR: requirements.txt missing" && exit 1)
          test -f .streamlit/config.toml || (echo "ERROR: .streamlit/config.toml missing" && exit 1)
          test -f .streamlit/secrets.toml.example || (echo "ERROR: secrets template missing" && exit 1)
          echo "Required deploy files present OK"

      - name: Streamlit health check
        run: |
          streamlit --version
          python -c "import streamlit; print('streamlit import OK:', streamlit.__version__)"
