[project]
name = "rag-engine"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.ruff]
target-version = "py311"
src = ["src", "."]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "RUF"]
ignore = [
  "BLE001",  # broad except is intentional for resilient app/LLM code
  "DTZ003",  # datetime.now(timezone.utc) used instead
  "DTZ006",  # fromtimestamp() tz handled per-call
  "EXE001",  # populate_index.py shebang kept for direct execution
  "E501",    # long LLM prompt strings are more readable unwrapped
  "UP017",   # datetime.timezone.utc preferred over datetime.UTC alias
  "UP042",   # str+Enum mixin is intentional for IntentType
]
exclude = [".venv", ".git", "__pycache__", ".ruff_cache"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
reportMissingImports = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportGeneralTypeIssues = false
extraPaths = ["src"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
reportMissingImports = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportGeneralTypeIssues = false
reportAny = false
extraPaths = ["src"]
